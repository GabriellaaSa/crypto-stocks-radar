name: Sinais diários

on:
  schedule:
    - cron: "0 21 * * *" # 18h em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sinais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install yfinance pandas numpy requests

      - name: Registrar sinais (e enviar Telegram, se configurado)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/registrar_sinais.py

      - name: Commitar histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sinais_historico.csv
          git diff --cached --quiet || git commit -m "Sinais de $(date -u +%Y-%m-%d)"
          git push
